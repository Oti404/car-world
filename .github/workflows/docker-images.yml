name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-carworld
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/oti404
  # Server folder (no hyphen); images keep the repo name (car-world-*).
  SERVER_DIR: proiecte/carworld

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: frontend
            context: .
          - name: backend
            context: ./server
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/car-world-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/car-world-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          EOF
          ssh deploy true

      # The compose file in this repo is the source of truth; .env stays on the server only.
      - name: Copy docker-compose.yml
        run: |
          ssh deploy "test -f ~/${SERVER_DIR}/.env" \
            || { echo "::error::~/${SERVER_DIR}/.env is missing on the server"; exit 1; }
          rsync -av docker-compose.yml "deploy:${SERVER_DIR}/docker-compose.yml"

      - name: Pull + up
        run: |
          ssh deploy 'bash -s' <<EOF
          set -euo pipefail
          cd ~/${SERVER_DIR}
          export TAG=${{ github.sha }}
          docker compose pull
          docker compose up -d --wait --wait-timeout 180
          docker image prune -f
          docker compose ps
          EOF

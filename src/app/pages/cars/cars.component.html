<div class="cars-container">
  <header class="page-header">
    <h1>Available Premium Cars</h1>
    <p class="subtitle">Explore our curated selection of high-performance vehicles</p>
  </header>

  <div class="cars-grid">
    <ng-container *ngIf="carsList$ | async as carsList; else loading">
      @for (car of carsList; track car.id) {
        <app-car-item
          [carItem]="car"
          (buttonClicked)="onAddToCart(car)"
        />
      }
    </ng-container>
    <ng-template #loading>
      <p class="loading-text">Loading premium cars from the garage...</p>
    </ng-template>
  </div>
</div>

<div class="cart-container">
  <header class="cart-header">
    <h1>Your Shopping Cart</h1>
    <p *ngIf="!authService.getCurrentUser()" class="auth-warning">
      <a routerLink="/login">Login</a> to proceed with checkout.
    </p>
  </header>

  <div class="empty-cart" *ngIf="(cartService.cartItems$ | async)?.length === 0">
    <i class="fas fa-shopping-cart empty-icon"></i>
    <p>Your vehicle selection is currently empty.</p>
    <button routerLink="/cars" class="btn-primary">Browse Collection</button>
  </div>

  <div class="cart-content" *ngIf="(cartService.cartItems$ | async) as cartItems">
    <div class="cart-items-list" *ngIf="cartItems.length > 0">

      <div class="cart-item" *ngFor="let item of cartItems">
        <img [src]="item.images && item.images.length > 0 ? item.images[0] : 'assets/placeholder-car.jpg'" class="item-image fade-in" loading="lazy" alt="{{ item.name }}"/>

        <div class="item-details">
          <h3>{{ item.name }}</h3>
          <p class="item-specs">
            {{ item.engineSpecs }}
          </p>
        </div>

        <div class="item-actions">
          <span class="item-price">{{ item.configuredPrice | currency:'EUR':'symbol':'1.0-0' }}</span>
          <button class="btn-remove" (click)="cartService.removeFromCart(item)">
            <i class="fas fa-trash"></i> Remove
          </button>
        </div>
      </div>

      <div class="cart-summary">
        <button class="btn-checkout" (click)="onCheckout()" [disabled]="isCheckoutInProgress">
          {{ isCheckoutInProgress ? 'Processing...' : 'Place Order' }}
        </button>
      </div>
    </div>
  </div>

</div>

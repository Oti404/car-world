<div class="contact-container">
  <div class="contact-card">
    <header class="contact-header">
      <h1>Contact Us</h1>
      <p class="subtitle">Have a question about a vehicle or our services? Send us a message.</p>
    </header>

    <div *ngIf="isSuccess" class="success-message fade-in">
      <i class="fas fa-check-circle success-icon"></i>
      <h3>Message Sent!</h3>
      <p>Thank you for reaching out. Our team will get back to you as soon as possible.</p>
      <button class="btn-reset" (click)="isSuccess = false">Send another message</button>
    </div>

    <form *ngIf="!isSuccess" class="contact-form" (ngSubmit)="onSubmit()" #contactForm="ngForm">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" [(ngModel)]="formData.name" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" [(ngModel)]="formData.email" required placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" [(ngModel)]="formData.subject" placeholder="What is this regarding?">
      </div>

      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" name="message" [(ngModel)]="formData.message" required rows="5" placeholder="How can we help you?"></textarea>
      </div>

      <div class="form-actions">
        <app-button
          buttonLabel="Send Message"
          buttonIcon="fa-paper-plane"
          [buttonType]="buttonType.Orange"
          [disabled]="isSubmitting || !contactForm.form.valid"
        />
      </div>
    </form>
  </div>
</div>

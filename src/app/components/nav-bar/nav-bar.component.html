<nav class="navbar">
  <div class="nav-container">

    <a routerLink="/" class="brand-area">
      <div class="brand-text">
        <span class="brand-title">CAR</span>
        <span class="brand-subtitle">WORLD</span>
      </div>
      <span class="brand-signature">by Otniel & MHP</span>
    </a>

    <div class="nav-right-side">

      <div class="nav-links" [class.active]="isMenuOpen">
        <a routerLink="/home" routerLinkActive="active-link" (click)="closeMenu()">Home</a>
        <a routerLink="/news" routerLinkActive="active-link" (click)="closeMenu()">News</a>
        <a routerLink="/cars" routerLinkActive="active-link" (click)="closeMenu()">Cars</a>
        <a routerLink="/contact" routerLinkActive="active-link" (click)="closeMenu()">Contact</a>

        <ng-container *ngIf="authService.user$ | async as user; else guestLinks">
          <a routerLink="/garage" routerLinkActive="active-link" (click)="closeMenu()">My Garage</a>
          <a *ngIf="authService.isAdmin$ | async" routerLink="/admin-dashboard" routerLinkActive="active-link" class="admin-link" (click)="closeMenu()">Admin DB</a>
          <a routerLink="/profile" routerLinkActive="active-link" class="nav-profile-link" (click)="closeMenu()">
            <i class="fas fa-user-circle"></i>
            <span>{{ user.displayName }}</span>
          </a>
          <a class="nav-logout-btn" (click)="logout()">Logout</a>
        </ng-container>

        <ng-template #guestLinks>
          <a routerLink="/login" routerLinkActive="active-link" (click)="closeMenu()">Login</a>
          <a routerLink="/register" routerLinkActive="active-link" (click)="closeMenu()">Register</a>
        </ng-template>
      </div>

      <a routerLink="/cart" class="cart-icon" (click)="closeMenu()">
        <i class="fas fa-shopping-cart"></i>

        @if (cartCount() > 0) {
          <span class="cart-badge">{{ cartCount() }}</span>
        }
      </a>

      <button class="theme-toggle-btn" (click)="themeService.toggleTheme()" [title]="themeService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
        <i class="fas" [class.fa-sun]="themeService.isDarkMode()" [class.fa-moon]="!themeService.isDarkMode()"></i>
      </button>

      <button class="hamburger-btn" (click)="toggleMenu()">
        <i class="fas" [class.fa-bars]="!isMenuOpen" [class.fa-times]="isMenuOpen"></i>
      </button>

    </div>

  </div>
</nav>
